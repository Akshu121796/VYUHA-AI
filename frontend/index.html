<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("vyuha-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = storedTheme ? storedTheme === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VYUHA.AI | Cyber Security Operations & XDR Dashboard</title>
    <meta name="description" content="VYUHA.AI delivers advanced security posture monitoring, automated endpoint vulnerability detection, lateral threat movement analytics, and AI-assisted Incident Response." />

</html>
